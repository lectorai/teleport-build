name: Build Teleport image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag of this repo to package, e.g. v18.11.10
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }'

      - uses: actions/checkout@v5

      # Upstream's fetch-debs helper stages the runtime libraries for the distroless image.
      - uses: actions/checkout@v5
        with:
          repository: gravitational/teleport
          ref: ${{ inputs.version }}
          path: upstream
          sparse-checkout: build.assets/charts

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "teleport-$VERSION-linux-amd64-bin.tar.gz"

      - name: Build image
        run: |
          docker build --build-arg RELEASE_ARCHIVE="teleport-$VERSION-linux-amd64-bin.tar.gz" -t "teleport:${VERSION#v}" .
          docker save "teleport:${VERSION#v}" | gzip > "teleport-image-$VERSION-linux-amd64.tar.gz"

      - uses: actions/upload-artifact@v5
        with:
          name: image
          path: teleport-image-*.tar.gz
          compression-level: 0
